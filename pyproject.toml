[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-journey"
version = "2.0.0"
description = "A 26-step educational journey from basic XOR to Cuckoo Filters"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Amirsam Azmoodeh", email = "amirsamazmoodeh@gmail.com"}
]
requires-python = ">=3.8"
dependencies = [
    "bitarray>=2.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
    "ipython>=8.0.0",
    "pre-commit>=3.0.0"
]
benchmark = ["pytest-benchmark>=4.0.0"]

[project.urls]
Homepage = "https://github.com/yourusername/crypto-journey"
Repository = "https://github.com/yourusername/crypto-journey"
Issues = "https://github.com/yourusername/crypto-journey/issues"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]